[project]
name = "agy-route"
version = "0.1.0"
description = "Typed, policy-gated proxy in front of the agy (Google Antigravity) CLI."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "agy-harness contributors" }]
keywords = [
    "agy", "antigravity", "gemini", "web-search", "grounded-search",
    "claude-code-plugin", "typer",
]
dependencies = [
    "typer>=0.12",
]

[project.urls]
Homepage = "https://github.com/hsuanguo/agy-harness"
Repository = "https://github.com/hsuanguo/agy-harness"

[project.scripts]
agy-route = "agy_route.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agy_route"]

# The Claude-plugin tree (manifest, SKILL, command) also lives at the repo
# root for human inspection / GitHub browsing. The canonical, runtime-use
# copies of the policy files ship with the Python package under
# `src/agy_route/policies/` so importlib.resources can find them after
# `uv tool install`.
[tool.hatch.build.targets.wheel.shared-data]
".claude-plugin" = "agy_harness/claude-plugin"
"commands"      = "agy_harness/commands"
"skills"        = "agy_harness/skills"
"config"        = "agy_harness/config"

[tool.hatch.build.targets.wheel.force-include]
"README.md"      = "agy_harness/README.md"
"CHANGELOG.md"   = "agy_harness/CHANGELOG.md"
"LICENSE"        = "agy_harness/LICENSE"
"pyproject.toml" = "agy_harness/pyproject.toml"
