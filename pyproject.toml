[project]
name = "agy-route"
version = "0.4.0"
description = "Typed, policy-gated proxy in front of the agy (Google Antigravity) CLI. Claude Code + opencode support."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "agy-route contributors" }]
keywords = [
    "agy", "antigravity", "gemini", "web-search", "grounded-search",
    "claude-code-plugin", "opencode", "typer",
]
dependencies = [
    "typer>=0.12",
]

[project.urls]
Homepage = "https://github.com/hsuanguo/agy-route"
Repository = "https://github.com/hsuanguo/agy-route"

[project.scripts]
agy-route = "agy_route.cli:main"
agy-route-hook-pretooluse = "agy_route.hooks.pretooluse:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agy_route"]

# The Claude-plugin tree (manifest, SKILL, command, hooks) lives at the repo
# root for human inspection / GitHub browsing. The canonical, runtime-use
# copies of the policy files ship with the Python package under
# `src/agy_route/policies/` so importlib.resources can find them after
# `uv tool install`. The install_data mirror (SKILL.md + hooks.json + the
# opencode plugin JS + opencode command markdowns used by
# `agy-route install --target opencode`) is force-included so it ships
# inside the wheel.
[tool.hatch.build.targets.wheel.force-include]
"src/agy_route/install_data/hooks.json"                            = "agy_route/install_data/hooks.json"
"src/agy_route/install_data/skill.md"                             = "agy_route/install_data/skill.md"
"src/agy_route/install_data/skill-research.md"                    = "agy_route/install_data/skill-research.md"
"src/agy_route/install_data/opencode-plugin/agy-route.js"          = "agy_route/install_data/opencode-plugin/agy-route.js"
"src/agy_route/install_data/opencode-commands/agy-search.md"       = "agy_route/install_data/opencode-commands/agy-search.md"
"src/agy_route/install_data/opencode-commands/agy-research.md"     = "agy_route/install_data/opencode-commands/agy-research.md"
".claude-plugin"                                                    = "agy_route/claude-plugin"
"commands"                                                          = "agy_route/commands"
"opencode-commands"                                                 = "agy_route/opencode-commands"
"opencode-plugin"                                                   = "agy_route/opencode-plugin"
"skills"                                                            = "agy_route/skills"
"config"                                                            = "agy_route/config"
"hooks"                                                             = "agy_route/hooks"
"README.md"                                                         = "agy_route/README.md"
"CHANGELOG.md"                                                      = "agy_route/CHANGELOG.md"
"LICENSE"                                                           = "agy_route/LICENSE"
"pyproject.toml"                                                    = "agy_route/pyproject.toml"
